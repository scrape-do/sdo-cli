# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Every job runs on GitHub-hosted runners: free for a public repository, a
# clean image every time, and no code from outside the org ever reaches the
# org's persistent self-hosted runners. CodeQL is the one exception: its result
# upload and its own status calls are GitHub API requests, which the org's IP
# allow list only accepts from the self-hosted runners, so it runs there for
# same-repository events only; a pull request from a fork is not analysed
# (its code must not reach those runners) and is analysed on main once merged.
#
# go.mod pins the sdo-go SDK to a released version and go.sum verifies it, so
# every job builds against exactly that version from the module proxy.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.26", "1.27"] # go.mod's minimum, and the current release
        include:
          - { os: macos-latest, go: "1.27" }
          - { os: windows-latest, go: "1.27" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true # the newest patch release, not one cached on the runner
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o sdo ./cmd/sdo

  # Format, install name, hermeticity and the coverage floor run once, on
  # Linux, not across the OS matrix: the scripts are bash (Windows runners
  # default to PowerShell) and a CRLF checkout on Windows would make gofmt flag
  # every file. The floor is 99%.
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: $unformatted" >&2
            gofmt -d .
            exit 1
          fi
      # `go install <module>/cmd/sdo@version` must give users a binary named
      # sdo: Go names it after the package directory.
      - name: go install produces an sdo binary
        run: |
          GOBIN="$RUNNER_TEMP/gobin" go install ./cmd/sdo
          test -x "$RUNNER_TEMP/gobin/sdo" || { echo "::error::go install did not produce a binary named sdo" >&2; exit 1; }
      # The suite must not depend on the runner's (or a developer's) Scrape.do
      # settings: TestMain clears them, and this proves it.
      - name: Tests are hermetic under hostile SDO_* settings
        env:
          SDO_TOKEN: hostile-token-value
          SDO_BASE_URL: http://hostile.invalid
          SDO_ASYNC_BASE_URL: http://hostile.invalid
          SDO_TIMEOUT: abc
          SDO_CONFIG_FILE: /nonexistent/sdo/config.json
        run: go test ./...
      - name: Coverage floor (99%)
        run: |
          go test -coverprofile=coverage.out ./...
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 99) ? 0 : 1 }' || {
            echo "::error::coverage $pct% is below the 99% floor" >&2; exit 1; }

  # Regenerate the CLI + MCP compat surface and fail on any drift from the
  # committed api-surface.txt. Any add/remove/rename of a command, flag,
  # argument, MCP tool or tool parameter must come with a regenerated golden.
  api-surface:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Check CLI + MCP surface for drift
        run: |
          go run ./tools/apisurface > api-surface.txt
          if ! git diff --exit-code api-surface.txt; then
            echo "::error::CLI/MCP surface changed. Regenerate with 'go run ./tools/apisurface > api-surface.txt' and commit api-surface.txt." >&2
            exit 1
          fi

  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # The persistent runners may still hold root-owned files that an older,
      # container-based job left in this workspace; reclaim them before the
      # checkout cleans it.
      - name: Reclaim the workspace
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "$PWD:/w" golang:1.27 chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
